<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bruce BLE Test</title>

<style>
body{
  margin:0;
  padding:15px;
  background:#000;
  color:#fff;
  font-family:monospace;
}

button{
  background:#181818;
  color:#fff;
  border:1px solid #444;
  padding:12px;
  margin:4px;
  border-radius:8px;
}

button:active{
  background:#333;
}

#status{
  margin:10px 0;
  color:#aaa;
}

#log{
  white-space:pre-wrap;
  word-break:break-word;
  background:#090909;
  border:1px solid #222;
  padding:10px;
  min-height:300px;
}

input{
  width:100%;
  box-sizing:border-box;
  background:#111;
  color:#fff;
  border:1px solid #444;
  padding:12px;
  margin-bottom:10px;
  font-family:monospace;
}
</style>
</head>

<body>

<h3>Bruce BLE Test</h3>

<button id="connect">CONNECT</button>

<input
 id="path"
 value="/!CHEAT/reader.txt"
>

<div id="status">Disconnected</div>

<br>

<button onclick="send('storage list /')">
LIST ROOT
</button>

<button onclick="readFile()">
READ FILE
</button>

<button onclick="testWrite()">
TEST WRITE
</button>

<button onclick="clearLog()">
CLEAR
</button>

<pre id="log"></pre>


<script>

const SERIAL_SERVICE =
"4371ec0b-3d43-49f9-b731-7c72a4a7bb91";

const SERIAL_CHAR =
"d555ed97-bf2a-4f46-b3eb-d1fcdd7325e9";

let device = null;
let server = null;
let characteristic = null;

const encoder = new TextEncoder();
const decoder = new TextDecoder();

const log =
document.getElementById("log");

const status =
document.getElementById("status");


function print(text){

  log.textContent += text;

  log.scrollTop =
    log.scrollHeight;

}


function clearLog(){

  log.textContent = "";

}


async function connect(){

  try{

    print("\n=== CONNECTING ===\n");

    device =
      await navigator.bluetooth.requestDevice({

        acceptAllDevices:true,

        optionalServices:[
          SERIAL_SERVICE
        ]

      });

    print(
      "Device: " +
      (device.name || "unknown") +
      "\n"
    );


    device.addEventListener(
      "gattserverdisconnected",
      ()=>{
        status.textContent =
          "Disconnected";

        print(
          "\n=== DISCONNECTED ===\n"
        );
      }
    );


    server =
      await device.gatt.connect();


    print("GATT connected\n");


    const service =
      await server.getPrimaryService(
        SERIAL_SERVICE
      );


    characteristic =
      await service.getCharacteristic(
        SERIAL_CHAR
      );


    print(
      "Characteristic found\n"
    );


    await characteristic.startNotifications();


    characteristic.addEventListener(
      "characteristicvaluechanged",
      event => {

        const data =
          decoder.decode(
            event.target.value
          );

        print(
          "\n<<< BRUCE <<<\n" +
          JSON.stringify(data) +
          "\n"
        );

      }
    );


    status.textContent =
      "CONNECTED";

    print(
      "\n=== READY ===\n"
    );

  }
  catch(e){

    print(
      "\nCONNECT ERROR:\n" +
      e.name +
      "\n" +
      e.message +
      "\n"
    );

  }

}


async function write(text){

  const data =
    encoder.encode(text);

  const chunkSize = 20;


  for(
    let i=0;
    i<data.length;
    i+=chunkSize
  ){

    const chunk =
      data.slice(
        i,
        i+chunkSize
      );


    if(
      characteristic.writeValueWithResponse
    ){

      await characteristic
        .writeValueWithResponse(chunk);

    }
    else{

      await characteristic
        .writeValue(chunk);

    }


    await new Promise(
      r=>setTimeout(r,30)
    );

  }

}


async function send(command){

  if(!characteristic){

    print(
      "\nNOT CONNECTED\n"
    );

    return;
  }


  print(
    "\n>>> BRUCE >>>\n" +
    JSON.stringify(command) +
    "\n"
  );


  /*
    Bruce serial commands use CRLF.
  */

  await write(
    command + "\r\n"
  );

}


function readFile(){

  const path =
    document.getElementById("path")
      .value
      .trim();


  send(
    "storage read " +
    path
  );

}


function testWrite(){

  const path =
    document.getElementById("path")
      .value
      .trim();


  /*
    VERY small test.

    If this works, we know writing works.
  */

  send(
    "storage write " +
    path
  );


  setTimeout(
    async ()=>{

      await write(
        "WEB TEST\r\n"
      );

      await new Promise(
        r=>setTimeout(r,100)
      );

      await write(
        "EOF\r\n"
      );

      print(
        "\nUPLOAD SENT\n"
      );

    },
    500
  );

}


document
.getElementById("connect")
.addEventListener(
  "click",
  connect
);

</script>

</body>
</html>
