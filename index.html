<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bruce Reader Editor</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    padding: 14px;
    border-bottom: 1px solid #222;
}

.title {
    font-size: 18px;
    font-weight: 700;
}

.path {
    margin-top: 4px;
    font-family: monospace;
    font-size: 12px;
    color: #888;
}

.controls {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-bottom: 1px solid #222;
}

button {
    flex: 1;
    min-height: 44px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 14px;
    font-weight: 600;
}

button:active {
    background: #222;
}

button:disabled {
    opacity: .35;
}

#editor {
    flex: 1;
    width: 100%;
    resize: none;
    border: 0;
    outline: 0;
    padding: 14px;
    background: #050505;
    color: #fff;
    font-family: monospace;
    font-size: 15px;
    line-height: 1.5;
    tab-size: 4;
}

#status {
    min-height: 32px;
    padding: 7px 12px;
    border-top: 1px solid #222;
    color: #aaa;
    font-family: monospace;
    font-size: 12px;
}

#log {
    max-height: 130px;
    overflow-y: auto;
    border-top: 1px solid #222;
    padding: 8px 12px;
    background: #020202;
    color: #777;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<header>
    <div class="title">Bruce Reader Editor</div>
    <div class="path">LittleFS://!CHEAT/reader.txt</div>
</header>

<div class="controls">
    <button id="connect">CONNECT</button>
    <button id="sync" disabled>SYNC</button>
    <button id="save" disabled>SAVE</button>
</div>

<textarea id="editor"
    spellcheck="false"
    autocorrect="off"
    autocapitalize="off"
    placeholder="File contents..."></textarea>

<div id="status">Disconnected</div>
<div id="log"></div>

<script>

/* =========================================================
   BRUCE BLE
   ========================================================= */

var BRUCE_SERVICE =
    "4371ec0b-3d43-49f9-b731-7c72a4a7bb91";

var BRUCE_CHARACTERISTIC =
    "d555ed97-bf2a-4f46-b3eb-d1fcdd7325e9";

var NUS_SERVICE =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

var NUS_RX =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

var NUS_TX =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


/*
 * EXACT TARGET.
 * Do not change this.
 */
var TARGET_PATH = "!CHEAT/reader.txt";


var device = null;
var characteristic = null;

var connected = false;

var rxBuffer = "";
var notificationHandler = null;


/* =========================================================
   UI
   ========================================================= */

var connectButton = document.getElementById("connect");
var syncButton = document.getElementById("sync");
var saveButton = document.getElementById("save");
var editor = document.getElementById("editor");
var statusBox = document.getElementById("status");
var logBox = document.getElementById("log");


function status(text) {
    statusBox.textContent = text;
}


function log(text) {
    logBox.textContent += text + "\n";
    logBox.scrollTop = logBox.scrollHeight;
}


function sleep(ms) {
    return new Promise(function(resolve) {
        setTimeout(resolve, ms);
    });
}


/* =========================================================
   UTF-8
   ========================================================= */

function textToBytes(text) {
    return new TextEncoder().encode(text);
}


function bytesToText(data) {
    return new TextDecoder().decode(data);
}


/* =========================================================
   BLE NOTIFICATIONS
   ========================================================= */

function onNotification(event) {

    var value = event.target.value;

    var bytes = new Uint8Array(
        value.buffer,
        value.byteOffset,
        value.byteLength
    );

    var text = bytesToText(bytes);

    rxBuffer += text;

    log("<<< " + JSON.stringify(text));
}


/* =========================================================
   WRITE
   ========================================================= */

async function bleWrite(text) {

    if (!characteristic) {
        throw new Error("BLE characteristic is not connected");
    }

    var data = textToBytes(text);

    /*
     * Bruce expects the command as a BLE write.
     *
     * The official Bruce app uses the same serial transport.
     */

    if (characteristic.writeValueWithResponse) {
        await characteristic.writeValueWithResponse(data);
    } else {
        await characteristic.writeValue(data);
    }

    log(">>> " + JSON.stringify(text));
}


/* =========================================================
   CONNECT
   ========================================================= */

async function connectBruce() {

    if (!navigator.bluetooth) {
        status("Web Bluetooth is not available");
        return;
    }

    try {

        status("Searching...");

        device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
                BRUCE_SERVICE,
                NUS_SERVICE
            ]
        });

        log("DEVICE: " + (device.name || "Bruce"));

        device.addEventListener(
            "gattserverdisconnected",
            disconnected
        );

        status("Connecting...");

        var server = await device.gatt.connect();

        /*
         * First try Bruce's native serial service.
         */

        try {

            var service =
                await server.getPrimaryService(BRUCE_SERVICE);

            characteristic =
                await service.getCharacteristic(
                    BRUCE_CHARACTERISTIC
                );

            log("Using Bruce BLE service");

        } catch (e) {

            /*
             * Fallback to Nordic UART.
             */

            var nus =
                await server.getPrimaryService(NUS_SERVICE);

            characteristic =
                await nus.getCharacteristic(NUS_RX);

            var tx =
                await nus.getCharacteristic(NUS_TX);

            /*
             * For NUS, notifications come from TX.
             */
            characteristic.notifyCharacteristic = tx;

            log("Using NUS fallback");
        }


        /*
         * Native Bruce characteristic is both
         * write + notify.
         */

        var notifyCharacteristic =
            characteristic.notifyCharacteristic ||
            characteristic;

        await notifyCharacteristic.startNotifications();

        notifyCharacteristic.addEventListener(
            "characteristicvaluechanged",
            onNotification
        );

        connected = true;

        connectButton.textContent = "DISCONNECT";
        syncButton.disabled = false;
        saveButton.disabled = false;

        status("Connected");

        log("CONNECTED");

    } catch (error) {

        console.error(error);

        status("Connection failed");

        log("ERROR: " + error.message);
    }
}


/* =========================================================
   DISCONNECT
   ========================================================= */

function disconnected() {

    connected = false;
    characteristic = null;

    connectButton.textContent = "CONNECT";

    syncButton.disabled = true;
    saveButton.disabled = true;

    status("Disconnected");

    log("DISCONNECTED");
}


async function disconnectBruce() {

    if (device && device.gatt.connected) {
        device.gatt.disconnect();
    }

    disconnected();
}


/* =========================================================
   COMMAND
   ========================================================= */

async function command(cmd) {

    /*
     * Bruce serial commands terminate with CRLF.
     */

    rxBuffer = "";

    await bleWrite(cmd + "\r\n");

    /*
     * Give Bruce time to execute.
     */

    await sleep(350);
}


/* =========================================================
   WAIT FOR OUTPUT
   ========================================================= */

async function waitForOutput(timeout) {

    var start = Date.now();

    while (Date.now() - start < timeout) {

        if (rxBuffer.length > 0) {
            await sleep(150);
            return rxBuffer;
        }

        await sleep(50);
    }

    return rxBuffer;
}


/* =========================================================
   CLEAN BRUCE OUTPUT
   ========================================================= */

function cleanOutput(text, commandSent) {

    var result = text;

    /*
     * Remove CR.
     */
    result = result.replace(/\r/g, "");

    /*
     * Remove echoed command.
     */
    result = result.replace(
        commandSent.replace(/\r?\n/g, ""),
        ""
    );

    /*
     * Remove CLI prompt.
     */
    result = result.replace(/^#\s*/gm, "");

    return result.trim();
}


/* =========================================================
   ERROR DETECTION
   ========================================================= */

function hasBruceError(text) {

    return (
        /ERROR:/i.test(text) ||
        /Command not found/i.test(text) ||
        /Failed/i.test(text) ||
        /Could not open/i.test(text)
    );
}


/* =========================================================
   SYNC
   ========================================================= */

async function syncFile() {

    if (!connected) {
        status("Not connected");
        return;
    }

    syncButton.disabled = true;

    try {

        status("Reading reader.txt...");

        /*
         * IMPORTANT:
         *
         * Bruce's serial documentation describes storage paths
         * relative to the filesystem root.
         *
         * We deliberately do NOT add LittleFS:// to the CLI
         * command. LittleFS is already the active filesystem
         * because there is no SD card.
         */

        var cmd =
            "storage read " +
            TARGET_PATH;

        await command(cmd);

        var output =
            await waitForOutput(2500);

        log("READ RESPONSE:");
        log(output);

        if (hasBruceError(output)) {

            status("Bruce rejected the file path");

            throw new Error(
                "Bruce returned an error while reading " +
                TARGET_PATH
            );
        }

        var content =
            cleanOutput(output, cmd);

        /*
         * Do not replace the editor with the prompt or
         * command echo.
         */

        editor.value = content;

        status(
            "Loaded " +
            content.length +
            " characters"
        );

    } catch (error) {

        status("Read failed");

        log("READ ERROR: " + error.message);

    } finally {

        syncButton.disabled = false;
    }
}


/* =========================================================
   SAVE
   ========================================================= */

async function saveFile() {

    if (!connected) {
        status("Not connected");
        return;
    }

    saveButton.disabled = true;

    try {

        var content = editor.value;

        status("Starting upload...");

        /*
         * Start Bruce's text-file writer.
         */

        var cmd =
            "storage write " +
            TARGET_PATH;

        await command(cmd);

        await sleep(500);

        /*
         * If Bruce rejected the path, do NOT send the
         * file contents or EOF.
         */

        if (
            /ERROR:/i.test(rxBuffer) ||
            /Command not found/i.test(rxBuffer)
        ) {

            log("WRITE START FAILED:");
            log(rxBuffer);

            throw new Error(
                "Bruce did not enter storage-write mode"
            );
        }

        /*
         * Bruce's text upload protocol:
         *
         * one line per BLE write
         * each line ends with LF
         * EOF terminates the upload
         *
         * This is intentionally slow because Bruce's
         * serial RX buffer is small.
         */

        var lines = content.split("\n");

        for (var i = 0; i < lines.length; i++) {

            var line = lines[i];

            /*
             * Remove CR because we send LF ourselves.
             */
            line = line.replace(/\r$/, "");

            await bleWrite(line + "\n");

            /*
             * Pacing is important.
             */
            await sleep(80);
        }

        /*
         * Close Bruce's text writer.
         */
        await bleWrite("EOF\n");

        status("Waiting for Bruce...");

        await sleep(1200);

        log("WRITE RESPONSE:");
        log(rxBuffer);

        if (hasBruceError(rxBuffer)) {

            throw new Error(
                "Bruce reported an error during save"
            );
        }

        /*
         * IMPORTANT:
         *
         * Never claim success merely because BLE writes
         * completed.
         *
         * Read the file back and verify it.
         */

        status("Verifying...");

        rxBuffer = "";

        await command(
            "storage read " + TARGET_PATH
        );

        var verify =
            await waitForOutput(2500);

        log("VERIFY RESPONSE:");
        log(verify);

        if (hasBruceError(verify)) {

            throw new Error(
                "Verification read failed"
            );
        }

        var savedContent =
            cleanOutput(
                verify,
                "storage read " + TARGET_PATH
            );

        if (savedContent !== content) {

            log(
                "EXPECTED LENGTH: " +
                content.length
            );

            log(
                "DEVICE LENGTH: " +
                savedContent.length
            );

            throw new Error(
                "File was written but verification did not match"
            );
        }

        status(
            "Saved and verified: " +
            TARGET_PATH
        );

    } catch (error) {

        status("Save failed");

        log("SAVE ERROR: " + error.message);

    } finally {

        saveButton.disabled = false;
    }
}


/* =========================================================
   BUTTONS
   ========================================================= */

connectButton.addEventListener(
    "click",
    async function() {

        if (connected) {
            await disconnectBruce();
        } else {
            await connectBruce();
        }

    }
);


syncButton.addEventListener(
    "click",
    syncFile
);


saveButton.addEventListener(
    "click",
    saveFile
);

</script>

</body>
</html>
