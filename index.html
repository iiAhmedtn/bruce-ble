<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Bruce Reader</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

#top {
  padding: 10px;
  border-bottom: 1px solid #222;
}

#file {
  background: #111;
  border: 1px solid #333;
  border-radius: 7px;
  padding: 8px 10px;
  color: #aaa;
  font: 12px monospace;
  margin-bottom: 8px;
}

.buttons {
  display: flex;
  gap: 7px;
}

button {
  flex: 1;
  padding: 10px 8px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #181818;
  color: #fff;
  font-size: 13px;
}

button:active {
  background: #333;
}

button:disabled {
  opacity: .35;
}

#connect.connected {
  background: #087f3d;
  border-color: #087f3d;
}

#save {
  background: #0a84ff;
  border-color: #0a84ff;
}

#status {
  padding-top: 7px;
  color: #888;
  font-size: 11px;
}

#editor {
  flex: 1;
  width: 100%;
  min-height: 0;
  resize: none;
  border: 0;
  outline: 0;
  background: #000;
  color: #fff;
  padding: 16px;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;

  font-size: 16px;
  line-height: 1.5;

  -webkit-text-size-adjust: 100%;
}

#editor::placeholder {
  color: #444;
}

details {
  border-top: 1px solid #222;
  background: #080808;
}

summary {
  padding: 7px 10px;
  color: #666;
  font: 11px monospace;
}

#log {
  max-height: 150px;
  overflow-y: auto;
  padding: 5px 10px 10px;

  white-space: pre-wrap;
  word-break: break-word;

  font: 11px monospace;
}

.in {
  color: #4dff9f;
}

.out {
  color: #70a7ff;
}

.err {
  color: #ff6666;
}
</style>
</head>

<body>

<div id="top">

  <div id="file">
    LittleFS://!CHEAT/reader.txt
  </div>

  <div class="buttons">

    <button id="connect">
      Connect
    </button>

    <button id="sync" disabled>
      Sync
    </button>

    <button id="save" disabled>
      Save
    </button>

  </div>

  <div id="status">
    Not connected
  </div>

</div>

<textarea
  id="editor"
  placeholder="Type or paste here..."
  spellcheck="false"
  autocorrect="off"
  autocapitalize="off"
  autocomplete="off"
></textarea>

<details>
  <summary>BLE DEBUG</summary>
  <div id="log"></div>
</details>


<script>

(() => {

  /*
  ============================================================
  FIXED FILE
  ============================================================
  */

  const BRUCE_PATH = "!CHEAT/reader.txt";


  /*
  ============================================================
  BRUCE BLE UUIDs
  ============================================================
  */

  const SERIAL_SERVICE =
    "4371ec0b-3d43-49f9-b731-7c72a4a7bb91";

  const SERIAL_CHAR =
    "d555ed97-bf2a-4f46-b3eb-d1fcdd7325e9";


  /*
  ============================================================
  ELEMENTS
  ============================================================
  */

  const connectBtn =
    document.getElementById("connect");

  const syncBtn =
    document.getElementById("sync");

  const saveBtn =
    document.getElementById("save");

  const editor =
    document.getElementById("editor");

  const status =
    document.getElementById("status");

  const log =
    document.getElementById("log");


  /*
  ============================================================
  STATE
  ============================================================
  */

  let device = null;
  let characteristic = null;
  let connected = false;

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();

  let response = "";


  /*
  ============================================================
  LOCAL BACKUP
  ============================================================
  */

  const BACKUP =
    "bruce_reader_backup";

  try {

    editor.value =
      localStorage.getItem(BACKUP) || "";

  } catch (_) {}


  editor.addEventListener(
    "input",
    () => {

      try {

        localStorage.setItem(
          BACKUP,
          editor.value
        );

      } catch (_) {}

    }
  );


  /*
  ============================================================
  LOG
  ============================================================
  */

  function addLog(text, type) {

    const div =
      document.createElement("div");

    div.textContent = text;

    if (type)
      div.className = type;

    log.appendChild(div);

    log.scrollTop =
      log.scrollHeight;
  }


  function setStatus(text) {

    status.textContent = text;

  }


  /*
  ============================================================
  BLE NOTIFICATION
  ============================================================
  */

  function notification(event) {

    const text =
      decoder.decode(
        event.target.value
      );

    response += text;

    addLog(
      "<< " +
      JSON.stringify(text),
      "in"
    );

  }


  /*
  ============================================================
  WRITE BYTES
  ============================================================
  */

  async function writeBytes(bytes) {

    const CHUNK = 20;

    for (
      let i = 0;
      i < bytes.length;
      i += CHUNK
    ) {

      const chunk =
        bytes.slice(
          i,
          i + CHUNK
        );

      /*
       * Use response writes when available.
       * This prevents overflowing the ESP32 BLE
       * receive buffer.
       */

      if (
        typeof characteristic
          .writeValueWithResponse ===
        "function"
      ) {

        await characteristic
          .writeValueWithResponse(chunk);

      } else {

        await characteristic
          .writeValue(chunk);

      }

      await sleep(30);

    }

  }


  function sleep(ms) {

    return new Promise(
      resolve =>
        setTimeout(resolve, ms)
    );

  }


  /*
  ============================================================
  SEND BRUCE COMMAND
  ============================================================
  */

  async function command(text) {

    response = "";

    addLog(
      ">> " + JSON.stringify(text),
      "out"
    );

    /*
     * Bruce serial CLI command terminator.
     */

    await writeBytes(
      encoder.encode(
        text + "\r\n"
      )
    );

  }


  /*
  ============================================================
  CONNECT
  ============================================================
  */

  async function connect() {

    if (!navigator.bluetooth) {

      alert(
        "Web Bluetooth is not available in this browser."
      );

      return;

    }


    try {

      setStatus(
        "Opening Bluetooth..."
      );


      device =
        await navigator.bluetooth.requestDevice({

          acceptAllDevices: true,

          optionalServices: [
            SERIAL_SERVICE
          ]

        });


      device.addEventListener(
        "gattserverdisconnected",
        disconnected
      );


      setStatus(
        "Connecting to " +
        (device.name || "Bruce") +
        "..."
      );


      const server =
        await device.gatt.connect();


      const service =
        await server.getPrimaryService(
          SERIAL_SERVICE
        );


      characteristic =
        await service.getCharacteristic(
          SERIAL_CHAR
        );


      await characteristic
        .startNotifications();


      characteristic.addEventListener(
        "characteristicvaluechanged",
        notification
      );


      connected = true;

      connectBtn.textContent =
        "Disconnect";

      connectBtn.classList.add(
        "connected"
      );

      syncBtn.disabled = false;
      saveBtn.disabled = false;


      setStatus(
        "Connected to " +
        (device.name || "Bruce")
      );


      addLog(
        "BLE CONNECTED",
        "in"
      );

    }

    catch (error) {

      addLog(
        "CONNECT ERROR: " +
        error.message,
        "err"
      );

      setStatus(
        "Connection failed: " +
        error.message
      );

    }

  }


  /*
  ============================================================
  DISCONNECT
  ============================================================
  */

  function disconnected() {

    connected = false;

    characteristic = null;

    connectBtn.textContent =
      "Connect";

    connectBtn.classList.remove(
      "connected"
    );

    syncBtn.disabled = true;
    saveBtn.disabled = true;

    setStatus(
      "Disconnected"
    );

    addLog(
      "BLE DISCONNECTED",
      "err"
    );

  }


  function disconnect() {

    if (
      device &&
      device.gatt &&
      device.gatt.connected
    ) {

      device.gatt.disconnect();

    } else {

      disconnected();

    }

  }


  /*
  ============================================================
  SYNC
  ============================================================

  Reads ONLY:

      !CHEAT/reader.txt

  IMPORTANT:

  Sync replaces the editor with the actual
  Bruce file.

  This avoids accidentally saving old browser
  content back into Bruce.
  */

  async function sync() {

    if (!connected)
      return;


    try {

      setStatus(
        "Reading !CHEAT/reader.txt..."
      );


      const commandText =
        "storage read " +
        BRUCE_PATH;


      response = "";


      await command(
        commandText
      );


      /*
       * Wait for Bruce to finish sending.
       */

      await sleep(1500);


      let data =
        response;


      /*
       * Remove command echo if Bruce
       * sends it.
       */

      data =
        data.replace(
          commandText,
          ""
        );


      /*
       * Normalize CRLF.
       */

      data =
        data.replace(
          /\r/g,
          ""
        );


      /*
       * Remove leading/trailing blank lines.
       */

      data =
        data.replace(
          /^\n+/,
          ""
        );

      data =
        data.replace(
          /\n+$/,
          ""
        );


      /*
       * Detect actual errors.
       */

      if (
        /ERROR:/i.test(data) ||
        /not found/i.test(data) ||
        /no such file/i.test(data)
      ) {

        addLog(
          "READ ERROR: " + data,
          "err"
        );

        setStatus(
          "Bruce could not read the file."
        );

        return;

      }


      /*
       * Don't replace the editor with
       * nothing if no response arrived.
       */

      if (!data.trim()) {

        addLog(
          "Bruce returned no file data.",
          "err"
        );

        setStatus(
          "No data returned."
        );

        return;

      }


      /*
       * THIS IS THE IMPORTANT PART:
       *
       * The editor now becomes the actual
       * contents of reader.txt.
       */

      editor.value =
        data;


      try {

        localStorage.setItem(
          BACKUP,
          editor.value
        );

      } catch (_) {}


      setStatus(
        "Synced from LittleFS://!CHEAT/reader.txt"
      );


    }

    catch (error) {

      addLog(
        "SYNC ERROR: " +
        error.message,
        "err"
      );

      setStatus(
        "Sync failed."
      );

    }

  }


  /*
  ============================================================
  SAVE
  ============================================================

  Writes ONLY:

      !CHEAT/reader.txt
  */

  async function save() {

    if (!connected)
      return;


    try {

      const text =
        editor.value;


      setStatus(
        "Saving to LittleFS://!CHEAT/reader.txt..."
      );


      /*
       * Tell Bruce we are beginning
       * a storage upload.
       */

      await command(
        "storage write " +
        BRUCE_PATH
      );


      /*
       * Give Bruce time to enter
       * file-write mode.
       */

      await sleep(300);


      /*
       * Send every line separately.
       *
       * IMPORTANT:
       * File data uses LF.
       */

      const lines =
        text.split(/\r?\n/);


      for (
        const line of lines
      ) {

        await writeBytes(
          encoder.encode(
            line + "\n"
          )
        );

        await sleep(35);

      }


      /*
       * Finish upload.
       */

      await writeBytes(
        encoder.encode(
          "EOF\n"
        )
      );


      await sleep(1000);


      try {

        localStorage.setItem(
          BACKUP,
          text
        );

      } catch (_) {}


      setStatus(
        "Saved to LittleFS://!CHEAT/reader.txt"
      );


      addLog(
        "SAVE COMPLETE",
        "in"
      );

    }

    catch (error) {

      addLog(
        "SAVE ERROR: " +
        error.message,
        "err"
      );

      setStatus(
        "Save failed."
      );

    }

  }


  /*
  ============================================================
  BUTTON EVENTS
  ============================================================
  */

  connectBtn.addEventListener(
    "click",
    () => {

      if (connected)
        disconnect();
      else
        connect();

    }
  );


  syncBtn.addEventListener(
    "click",
    sync
  );


  saveBtn.addEventListener(
    "click",
    save
  );

})();

</script>

</body>
</html>
