<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>reader // bruce</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#fff;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  #bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #222;flex-wrap:wrap;}
  #bar button{background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer;}
  #bar button.on{background:#0a84ff;border-color:#0a84ff;}
  #bar button:disabled{opacity:.4;cursor:not-allowed;}
  #bar button:active:not(:disabled){background:#2a2a2a;}
  #pathRow{display:flex;gap:8px;padding:0 12px 10px;flex-wrap:wrap;}
  #pathRow input{flex:1;min-width:180px;background:#111;color:#fff;border:1px solid #333;
    border-radius:8px;padding:9px 10px;font-size:13px;font-family:ui-monospace,Menlo,monospace;}
  #status{font-size:11px;color:#888;padding:0 12px 8px;white-space:pre-wrap;}

  #pad{flex:1;width:100%;background:#000;color:#fff;border:none;outline:none;resize:none;
    padding:16px;font-size:17px;line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;}
  #pad::placeholder{color:#555;}

  details{border-top:1px solid #222;background:#0a0a0a;}
  details summary{padding:8px 12px;font-size:11px;color:#777;cursor:pointer;font-family:ui-monospace,Menlo,monospace;}
  #log{max-height:140px;overflow-y:auto;padding:0 12px 10px;font-family:ui-monospace,Menlo,monospace;
    font-size:11px;color:#8fae9c;white-space:pre-wrap;word-break:break-word;}
  #log .in{color:#4dff9f;}
  #log .err{color:#ff6b6b;}
</style>
</head>
<body>

<div id="bar">
  <button id="connectBtn">Connect</button>
  <button id="syncBtn" disabled>Sync from Bruce</button>
  <button id="saveBtn" disabled>Save to Bruce</button>
</div>
<div id="pathRow">
  <input id="pathInput" type="text" value="!CHEAT/reader.txt" spellcheck="false" autocapitalize="off" autocomplete="off">
</div>
<div id="status">not connected — typing is still saved in this browser meanwhile</div>

<textarea id="pad" placeholder="Type or paste here…" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>

<details>
  <summary>debug log</summary>
  <div id="log"></div>
</details>

<script>
(() => {
  const SERIAL_SERVICE = "4371ec0b-3d43-49f9-b731-7c72a4a7bb91";
  const SERIAL_CHAR    = "d555ed97-bf2a-4f46-b3eb-d1fcdd7325e9";
  const NUS_SERVICE    = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const NUS_RX         = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
  const NUS_TX         = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
  const LOCAL_KEY = "reader_txt_backup";

  const $ = (id) => document.getElementById(id);
  const pad = $("pad"), statusEl = $("status"), logEl = $("log");
  const connectBtn = $("connectBtn"), syncBtn = $("syncBtn"), saveBtn = $("saveBtn");
  const pathInput = $("pathInput");

  const encoder = new TextEncoder(), decoder = new TextDecoder();
  let device = null, writeChar = null, notifyChar = null;
  let collector = null; // active {onChunk} while awaiting a command's response
  let autosaveTimer = null;

  function setStatus(t){ statusEl.textContent = t; }
  function log(text, cls){
    const d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function backupLocally(text){ try{ localStorage.setItem(LOCAL_KEY, text); }catch(e){} }
  function loadLocalBackup(){ try{ return localStorage.getItem(LOCAL_KEY) || ""; }catch(e){ return ""; } }

  pad.value = loadLocalBackup();
  pad.addEventListener("input", () => {
    backupLocally(pad.value);
    if (writeChar) {
      clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(saveToDevice, 1200);
    }
  });

  function setConnectedUI(connected){
    connectBtn.textContent = connected ? "Disconnect" : "Connect";
    connectBtn.classList.toggle("on", connected);
    syncBtn.disabled = !connected;
    saveBtn.disabled = !connected;
  }

  async function connect(){
    if (!navigator.bluetooth) {
      alert("Web Bluetooth isn't available in this browser.");
      return;
    }
    try {
      setStatus("opening Bluetooth picker…");
      device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERIAL_SERVICE, NUS_SERVICE, "battery_service"]
      });
      device.addEventListener("gattserverdisconnected", onDisconnected);
      setStatus("connecting…");
      const server = await device.gatt.connect();

      try {
        const svc = await server.getPrimaryService(SERIAL_SERVICE);
        const ch = await svc.getCharacteristic(SERIAL_CHAR);
        writeChar = ch; notifyChar = ch;
      } catch (e1) {
        const svc = await server.getPrimaryService(NUS_SERVICE);
        writeChar = await svc.getCharacteristic(NUS_RX);
        notifyChar = await svc.getCharacteristic(NUS_TX);
      }
      await notifyChar.startNotifications();
      notifyChar.addEventListener("characteristicvaluechanged", onNotify);

      setConnectedUI(true);
      setStatus("connected to " + (device.name || "Bruce") + " — pulling " + pathInput.value + " …");
      log("connected", "in");
      await ensureFolder(pathInput.value);
      await syncFromDevice(true /* merge into existing box instead of replacing */);
    } catch (err) {
      log("connect error: " + err.name + ": " + err.message, "err");
      setStatus("connection failed: " + err.message);
      setConnectedUI(false);
    }
  }

  function onDisconnected(){
    setConnectedUI(false);
    setStatus("disconnected — typing is still saved in this browser meanwhile");
    log("disconnected", "err");
    writeChar = null; notifyChar = null;
  }

  function disconnect(){
    if (device && device.gatt.connected) device.gatt.disconnect();
    else onDisconnected();
  }

  connectBtn.addEventListener("click", () => {
    if (device && device.gatt.connected) disconnect();
    else connect();
  });

  function onNotify(event){
    const chunk = decoder.decode(event.target.value);
    if (collector) collector.onChunk(chunk);
    log("< " + chunk.replace(/\n/g, "\\n"));
  }

  async function writeRaw(bytes){
    const CHUNK = 20;
    for (let i = 0; i < bytes.length; i += CHUNK) {
      await writeChar.writeValue(bytes.slice(i, i + CHUNK));
      if (bytes.length > CHUNK) await new Promise(r => setTimeout(r, 15));
    }
  }

  async function sendLine(text){
    log("> " + text, "in");
    await writeRaw(encoder.encode(text + "\n"));
  }

  // Sends a command and collects whatever comes back until the device goes quiet.
  function sendAndCollect(cmd, idleMs = 700, maxWaitMs = 6000){
    return new Promise(async (resolve) => {
      let buf = "";
      let timer = null;
      const finish = () => { collector = null; clearTimeout(timer); resolve(buf); };
      collector = { onChunk: (c) => { buf += c; clearTimeout(timer); timer = setTimeout(finish, idleMs); } };
      timer = setTimeout(finish, idleMs);
      setTimeout(() => { if (collector) finish(); }, maxWaitMs);
      await sendLine(cmd);
    });
  }

  function splitPath(path){
    const idx = path.lastIndexOf("/");
    return idx === -1 ? { dir: "", file: path } : { dir: path.slice(0, idx), file: path.slice(idx + 1) };
  }

  async function ensureFolder(path){
    const { dir } = splitPath(path);
    if (!dir) return;
    await sendAndCollect("storage mkdir " + dir, 500, 2000); // harmless if it already exists
  }

  function cleanReadResponse(raw, cmdEcho){
    let text = raw;
    // strip a leading echo of the command we just sent, if the device echoes it
    if (text.startsWith(cmdEcho)) text = text.slice(cmdEcho.length);
    text = text.replace(/^[\r\n]+/, "");
    const lower = text.toLowerCase();
    if (!text.trim() || lower.includes("not found") || lower.includes("no such") || lower.includes("fail")) {
      return "";
    }
    return text.replace(/[\r\n]+$/, "");
  }

  async function syncFromDevice(mergeIntoBox){
    const path = pathInput.value.trim();
    if (!path) return;
    setStatus("reading " + path + " from Bruce…");
    const raw = await sendAndCollect("storage read " + path, 800, 6000);
    const existing = cleanReadResponse(raw, "storage read " + path);
    if (mergeIntoBox) {
      const current = pad.value.trim();
      if (existing && current && !current.includes(existing)) {
        pad.value = existing + "\n" + current;
      } else if (existing && !current) {
        pad.value = existing;
      }
      // if the device file was empty, keep whatever's already in the box
    } else {
      pad.value = existing;
    }
    backupLocally(pad.value);
    setStatus("synced with " + path + " on the Bruce");
  }

  async function saveToDevice(){
    if (!writeChar) return;
    const path = pathInput.value.trim();
    if (!path) return;
    setStatus("saving to " + path + " on the Bruce…");
    try {
      const text = pad.value;
      await sendLine("storage write " + path);
      await new Promise(r => setTimeout(r, 150));
      const lines = text.split(/\r\n|\n/);
      for (const line of lines) {
        await writeRaw(encoder.encode(line + "\n"));
        await new Promise(r => setTimeout(r, 12));
      }
      await writeRaw(encoder.encode("EOF\n"));
      backupLocally(text);
      setStatus("saved to " + path + " on the Bruce · " + new Date().toTimeString().slice(0,8));
    } catch (err) {
      log("save error: " + err.message, "err");
      setStatus("save failed — kept locally in this browser (" + err.message + ")");
    }
  }

  syncBtn.addEventListener("click", () => syncFromDevice(true));
  saveBtn.addEventListener("click", saveToDevice);
})();
</script>
</body>
</html>
