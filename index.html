<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bruce Reader Editor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{padding:14px;border-bottom:1px solid #222}
.title{font-size:18px;font-weight:700}
.path{margin-top:4px;font-family:monospace;font-size:12px;color:#777}
.controls{display:flex;gap:8px;padding:10px;border-bottom:1px solid #222}
button{flex:1;min-height:44px;border:1px solid #444;border-radius:8px;background:#111;color:#fff;font-size:14px;font-weight:600}
button:active{background:#222}
button:disabled{opacity:.35}
#editor{flex:1;width:100%;resize:none;outline:none;border:0;padding:14px;background:#050505;color:#fff;font-family:monospace;font-size:15px;line-height:1.5;spellcheck:false}
#status{min-height:32px;padding:7px 12px;border-top:1px solid #222;color:#aaa;font-family:monospace;font-size:12px}
#log{max-height:150px;overflow-y:auto;padding:8px 12px;border-top:1px solid #222;background:#020202;color:#777;font-family:monospace;font-size:11px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<div class="title">Bruce Reader Editor</div>
<div class="path">LittleFS://!CHEAT/reader.txt</div>
</header>

<div class="controls">
<button id="connect">CONNECT</button>
<button id="sync" disabled>SYNC</button>
<button id="save" disabled>SAVE</button>
</div>

<textarea id="editor" placeholder="Sync the file first..." spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
<div id="status">Disconnected</div>
<div id="log"></div>

<script>
var TARGET_PATH="!CHEAT/reader.txt";

var BRUCE_SERVICE="4371ec0b-3d43-49f9-b731-7c72a4a7bb91";
var BRUCE_CHARACTERISTIC="d555ed97-bf2a-4f46-b3eb-d1fcdd7325e9";

var device=null;
var characteristic=null;
var connected=false;
var rxBuffer="";

var connectButton=document.getElementById("connect");
var syncButton=document.getElementById("sync");
var saveButton=document.getElementById("save");
var editor=document.getElementById("editor");
var statusBox=document.getElementById("status");
var logBox=document.getElementById("log");

function status(t){statusBox.textContent=t}
function log(t){logBox.textContent+=t+"\n";logBox.scrollTop=logBox.scrollHeight}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

function notificationHandler(event){
    var v=event.target.value;
    var bytes=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);
    var text=new TextDecoder().decode(bytes);
    rxBuffer+=text;
    log("<<< "+JSON.stringify(text));
}

async function writeBytes(text){
    var data=new TextEncoder().encode(text);

    if(characteristic.writeValueWithoutResponse){
        await characteristic.writeValueWithoutResponse(data);
    }else{
        await characteristic.writeValue(data);
    }
}

async function sendCommand(command){
    await writeBytes(command+"\n");
    log(">>> "+JSON.stringify(command));
}

async function waitForText(text,timeout){
    var start=Date.now();

    while(Date.now()-start<timeout){
        if(rxBuffer.toLowerCase().indexOf(text.toLowerCase())!==-1){
            return true;
        }
        await sleep(25);
    }

    return false;
}

async function connectBruce(){
    try{
        if(!navigator.bluetooth){
            throw new Error("Web Bluetooth is not available");
        }

        status("Searching...");

        device=await navigator.bluetooth.requestDevice({
            acceptAllDevices:true,
            optionalServices:[BRUCE_SERVICE]
        });

        log("DEVICE: "+(device.name||"Bruce"));

        device.addEventListener("gattserverdisconnected",disconnected);

        status("Connecting...");

        var server=await device.gatt.connect();

        var service=await server.getPrimaryService(BRUCE_SERVICE);

        characteristic=await service.getCharacteristic(BRUCE_CHARACTERISTIC);

        log("Using Bruce BLE service");

        await characteristic.startNotifications();

        characteristic.addEventListener("characteristicvaluechanged",notificationHandler);

        connected=true;

        connectButton.textContent="DISCONNECT";
        syncButton.disabled=false;
        saveButton.disabled=false;

        status("Connected");
        log("CONNECTED");
    }catch(e){
        log("ERROR: "+e.message);
        status("Connection failed");
    }
}

function disconnected(){
    connected=false;
    characteristic=null;
    connectButton.textContent="CONNECT";
    syncButton.disabled=true;
    saveButton.disabled=true;
    status("Disconnected");
    log("DISCONNECTED");
}

function disconnectBruce(){
    if(device&&device.gatt&&device.gatt.connected){
        device.gatt.disconnect();
    }else{
        disconnected();
    }
}

function extractFileContent(response,command){
    var text=response.replace(/\r/g,"");

    text=text.replace(command,"");

    text=text.replace(/^\s*#\s*$/gm,"");

    return text.trimEnd();
}

async function syncFile(){
    if(!connected){
        status("Not connected");
        return;
    }

    syncButton.disabled=true;

    try{
        rxBuffer="";

        status("Reading reader.txt...");

        var command="storage read "+TARGET_PATH;

        await sendCommand(command);

        await sleep(1200);

        var response=rxBuffer;

        log("READ RESPONSE:");
        log(response);

        if(/Command not found/i.test(response)||/ERROR:/i.test(response)){
            throw new Error(response||"Bruce returned an error");
        }

        var content=extractFileContent(response,command);

        /*
         * Existing content is loaded into the editor.
         * You can now add, remove or modify anything.
         */
        editor.value=content;

        editor.focus();
        editor.setSelectionRange(editor.value.length,editor.value.length);

        status("Loaded "+editor.value.length+" characters");
    }catch(e){
        status("Read failed");
        log("READ ERROR: "+e.message);
    }finally{
        syncButton.disabled=false;
    }
}

async function saveFile(){
    if(!connected){
        status("Not connected");
        return;
    }

    saveButton.disabled=true;
    syncButton.disabled=true;

    try{
        var content=editor.value;

        var bytes=new TextEncoder().encode(content);

        /*
         * Bruce's storage write command requires a size.
         */
        var size=bytes.length+1024;

        var command="storage write "+TARGET_PATH+" "+size;

        rxBuffer="";

        status("Starting write...");

        await sendCommand(command);

        /*
         * Bruce prints:
         * Reading input data from serial buffer until EOF
         */
        var ready=await waitForText("Reading input data",5000);

        if(!ready){
            log("BRUCE DID NOT ENTER INPUT MODE");
            log("RX: "+rxBuffer);
            throw new Error("Bruce did not start file input");
        }

        log("BRUCE IS READY FOR DATA");

        rxBuffer="";

        /*
         * Send every line separately.
         * Bruce's RX buffer needs pacing.
         */
        var lines=content.split("\n");

        for(var i=0;i<lines.length;i++){
            var line=lines[i].replace(/\r$/,"");

            await writeBytes(line+"\n");

            await sleep(50);

            status("Writing "+(i+1)+" / "+lines.length);
        }

        status("Finishing...");

        await writeBytes("EOF\n");

        log(">>> "+JSON.stringify("EOF\n"));

        /*
         * Wait for firmware confirmation.
         */
        var written=await waitForText("File written",6000);

        if(!written){
            log("WRITE RESPONSE:");
            log(rxBuffer);
            throw new Error("Bruce did not confirm the file write");
        }

        log("WRITE SUCCESS:");
        log(rxBuffer);

        status("✓ Saved to "+TARGET_PATH);
    }catch(e){
        status("Save failed");
        log("SAVE ERROR: "+e.message);
    }finally{
        saveButton.disabled=false;
        syncButton.disabled=false;
    }
}

connectButton.addEventListener("click",function(){
    if(connected){
        disconnectBruce();
    }else{
        connectBruce();
    }
});

syncButton.addEventListener("click",syncFile);
saveButton.addEventListener("click",saveFile);
</script>
</body>
</html>
