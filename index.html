<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Bruce Reader Editor</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    padding: 14px;
    border-bottom: 1px solid #222;
}

.title {
    font-size: 18px;
    font-weight: 700;
}

.path {
    margin-top: 4px;
    font-family: monospace;
    font-size: 12px;
    color: #777;
}

.controls {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-bottom: 1px solid #222;
}

button {
    flex: 1;
    min-height: 44px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #111;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
}

button:active {
    background: #222;
}

button:disabled {
    opacity: .35;
}

#editor {
    flex: 1;
    width: 100%;
    resize: none;
    outline: none;
    border: none;

    padding: 14px;

    background: #050505;
    color: #fff;

    font-family: monospace;
    font-size: 15px;
    line-height: 1.5;

    spellcheck: false;
    autocorrect: off;
    autocapitalize: off;
}

#status {
    min-height: 32px;
    padding: 7px 12px;

    border-top: 1px solid #222;

    color: #aaa;

    font-family: monospace;
    font-size: 12px;
}

#log {
    max-height: 150px;
    overflow-y: auto;

    padding: 8px 12px;

    border-top: 1px solid #222;

    background: #020202;

    color: #777;

    font-family: monospace;
    font-size: 11px;

    white-space: pre-wrap;
}
</style>
</head>

<body>

<header>
    <div class="title">Bruce Reader Editor</div>
    <div class="path">
        LittleFS://!CHEAT/reader.txt
    </div>
</header>

<div class="controls">
    <button id="connect">CONNECT</button>
    <button id="sync" disabled>SYNC</button>
    <button id="save" disabled>SAVE</button>
</div>

<textarea id="editor"
    placeholder="Sync the file first..."
    spellcheck="false"
    autocorrect="off"
    autocapitalize="off"></textarea>

<div id="status">Disconnected</div>

<div id="log"></div>


<script>

/* =========================================================
   EXACT FILE
   ========================================================= */

var TARGET_PATH = "!CHEAT/reader.txt";


/* =========================================================
   BRUCE BLE UUIDs
   ========================================================= */

var BRUCE_SERVICE =
    "4371ec0b-3d43-49f9-b731-7c72a4a7bb91";

var BRUCE_CHARACTERISTIC =
    "d555ed97-bf2a-4f46-b3eb-d1fcdd7325e9";


/* NUS fallback */

var NUS_SERVICE =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

var NUS_RX =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

var NUS_TX =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


/* =========================================================
   STATE
   ========================================================= */

var device = null;

var writeCharacteristic = null;
var notifyCharacteristic = null;

var connected = false;

var rxBuffer = "";

var collecting = false;


/* =========================================================
   UI
   ========================================================= */

var connectButton =
    document.getElementById("connect");

var syncButton =
    document.getElementById("sync");

var saveButton =
    document.getElementById("save");

var editor =
    document.getElementById("editor");

var statusBox =
    document.getElementById("status");

var logBox =
    document.getElementById("log");


/* =========================================================
   HELPERS
   ========================================================= */

function sleep(ms) {

    return new Promise(function(resolve) {
        setTimeout(resolve, ms);
    });

}


function setStatus(text) {

    statusBox.textContent = text;

}


function log(text) {

    logBox.textContent += text + "\n";

    logBox.scrollTop =
        logBox.scrollHeight;

}


/* =========================================================
   BLE ENCODING
   ========================================================= */

function encode(text) {

    return new TextEncoder().encode(text);

}


function decode(data) {

    return new TextDecoder().decode(data);

}


/* =========================================================
   RECEIVE
   ========================================================= */

function onNotification(event) {

    var value = event.target.value;

    var bytes = new Uint8Array(
        value.buffer,
        value.byteOffset,
        value.byteLength
    );

    var text = decode(bytes);

    rxBuffer += text;

    log("<<< " + JSON.stringify(text));

}


/* =========================================================
   BLE WRITE
   ========================================================= */

async function writeRaw(text) {

    if (!writeCharacteristic) {

        throw new Error(
            "BLE write characteristic unavailable"
        );

    }

    var data = encode(text);

    /*
     * Keep writes small.
     * Bruce's characteristic is normally able to
     * handle these short text lines directly.
     */

    if (
        writeCharacteristic.writeValueWithResponse
    ) {

        try {

            await writeCharacteristic
                .writeValueWithResponse(data);

            return;

        } catch (e) {

            /*
             * Some browsers expose only writeValue.
             */

        }

    }

    await writeCharacteristic
        .writeValue(data);

}


/* =========================================================
   SEND COMMAND
   ========================================================= */

async function sendCommand(command) {

    rxBuffer = "";

    collecting = true;

    /*
     * Bruce's current iOS implementation appends
     * LF to commands.
     */

    await writeRaw(command + "\n");

    log(">>> " + JSON.stringify(command));

}


/* =========================================================
   WAIT FOR TEXT
   ========================================================= */

async function waitForText(
    text,
    timeout
) {

    var start =
        Date.now();

    while (
        Date.now() - start <
        timeout
    ) {

        if (
            rxBuffer
                .toLowerCase()
                .indexOf(
                    text.toLowerCase()
                ) !== -1
        ) {

            return true;

        }

        await sleep(40);

    }

    return false;

}


/* =========================================================
   WAIT FOR RESPONSE
   ========================================================= */

async function waitForResponse(
    timeout
) {

    var start =
        Date.now();

    var lastLength = 0;

    var quietSince = null;

    while (
        Date.now() - start <
        timeout
    ) {

        if (rxBuffer.length > lastLength) {

            lastLength =
                rxBuffer.length;

            quietSince =
                Date.now();

        }

        /*
         * Bruce replies in lines and then becomes quiet.
         */

        if (
            quietSince !== null &&
            Date.now() - quietSince > 650
        ) {

            break;

        }

        await sleep(40);

    }

    collecting = false;

    return rxBuffer;

}


/* =========================================================
   CLEAN READ RESPONSE
   ========================================================= */

function extractFileContent(
    response,
    command
) {

    var text = response;

    /*
     * Normalize line endings.
     */

    text =
        text.replace(/\r/g, "");

    /*
     * Remove command echo.
     */

    text =
        text.replace(
            command,
            ""
        );

    /*
     * Remove prompt.
     */

    text =
        text.replace(
            /^# ?/gm,
            ""
        );

    return text.trimEnd();

}


/* =========================================================
   CONNECT
   ========================================================= */

async function connectBruce() {

    if (!navigator.bluetooth) {

        setStatus(
            "Web Bluetooth unavailable"
        );

        return;

    }

    try {

        setStatus("Searching...");

        device =
            await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,

                optionalServices: [
                    BRUCE_SERVICE,
                    NUS_SERVICE
                ]
            });

        log(
            "DEVICE: " +
            (device.name || "Bruce")
        );

        device.addEventListener(
            "gattserverdisconnected",
            disconnected
        );

        setStatus("Connecting...");

        var server =
            await device.gatt.connect();


        /*
         * Try native Bruce BLE first.
         */

        try {

            var service =
                await server.getPrimaryService(
                    BRUCE_SERVICE
                );

            var characteristic =
                await service.getCharacteristic(
                    BRUCE_CHARACTERISTIC
                );

            writeCharacteristic =
                characteristic;

            notifyCharacteristic =
                characteristic;

            log(
                "Using Bruce BLE service"
            );

        } catch (e) {

            /*
             * NUS fallback.
             */

            var nus =
                await server.getPrimaryService(
                    NUS_SERVICE
                );

            writeCharacteristic =
                await nus.getCharacteristic(
                    NUS_RX
                );

            notifyCharacteristic =
                await nus.getCharacteristic(
                    NUS_TX
                );

            log(
                "Using NUS fallback"
            );

        }


        /*
         * Start notifications.
         */

        await notifyCharacteristic
            .startNotifications();

        notifyCharacteristic
            .addEventListener(
                "characteristicvaluechanged",
                onNotification
            );


        connected = true;

        connectButton.textContent =
            "DISCONNECT";

        syncButton.disabled = false;

        saveButton.disabled = false;

        setStatus("Connected");

        log("CONNECTED");

    } catch (error) {

        console.error(error);

        setStatus(
            "Connection failed"
        );

        log(
            "ERROR: " +
            error.message
        );

    }

}


/* =========================================================
   DISCONNECT
   ========================================================= */

function disconnected() {

    connected = false;

    writeCharacteristic = null;
    notifyCharacteristic = null;

    connectButton.textContent =
        "CONNECT";

    syncButton.disabled = true;
    saveButton.disabled = true;

    setStatus("Disconnected");

    log("DISCONNECTED");

}


function disconnectBruce() {

    if (
        device &&
        device.gatt &&
        device.gatt.connected
    ) {

        device.gatt.disconnect();

    }

    disconnected();

}


/* =========================================================
   SYNC
   ========================================================= */

async function syncFile() {

    if (!connected) {

        setStatus("Not connected");

        return;

    }

    syncButton.disabled = true;

    try {

        setStatus(
            "Reading reader.txt..."
        );


        var command =
            "storage read " +
            TARGET_PATH;


        /*
         * Send read command.
         */

        await sendCommand(command);


        /*
         * Wait for Bruce response.
         */

        var response =
            await waitForResponse(5000);


        log("READ RESPONSE:");
        log(response);


        /*
         * Check errors.
         */

        if (
            /ERROR:/i.test(response) ||
            /Command not found/i.test(response)
        ) {

            throw new Error(
                response.trim()
            );

        }


        /*
         * Extract the actual file contents.
         */

        var content =
            extractFileContent(
                response,
                command
            );


        /*
         * THIS is the important part:
         *
         * The existing file contents are placed
         * directly into the editor.
         *
         * You can now:
         * - add text
         * - remove text
         * - modify text
         */

        editor.value = content;


        /*
         * Put cursor at the end so you can
         * immediately continue typing.
         */

        editor.focus();

        editor.setSelectionRange(
            editor.value.length,
            editor.value.length
        );


        setStatus(
            "Loaded " +
            content.length +
            " characters"
        );


    } catch (error) {

        setStatus(
            "Read failed"
        );

        log(
            "READ ERROR: " +
            error.message
        );

    } finally {

        syncButton.disabled = false;

    }

}


/* =========================================================
   SAVE
   ========================================================= */

async function saveFile() {

    if (!connected) {

        setStatus(
            "Not connected"
        );

        return;

    }

    saveButton.disabled = true;
    syncButton.disabled = true;


    try {

        var content =
            editor.value;


        /*
         * Bruce's implementation uses the UTF-8
         * byte count + 1024 as the size argument.
         */

        var contentBytes =
            encode(content);

        var size =
            contentBytes.length + 1024;


        /*
         * IMPORTANT:
         *
         * The correct command is:
         *
         * storage write PATH SIZE
         */

        var command =
            "storage write " +
            TARGET_PATH +
            " " +
            size;


        setStatus(
            "Starting write..."
        );


        /*
         * Clear old response.
         */

        rxBuffer = "";


        /*
         * Send the header.
         */

        await sendCommand(command);


        log(
            "WRITE HEADER: " +
            command
        );


        /*
         * Bruce must enter its input mode
         * BEFORE we send the text.
         */

        var ready =
            await waitForText(
                "Reading input",
                4000
            );


        if (!ready) {

            log(
                "Bruce did not enter Reading input mode."
            );

            log(
                "Response: " +
                rxBuffer
            );

            throw new Error(
                "Bruce never entered write mode"
            );

        }


        log(
            "Bruce is ready for file data"
        );


        /*
         * Split into lines.
         *
         * Keep empty lines.
         */

        var lines =
            content.split("\n");


        /*
         * Send each line separately.
         *
         * Bruce's official iOS implementation
         * uses approximately 40 ms pacing.
         */

        for (
            var i = 0;
            i < lines.length;
            i++
        ) {

            var line =
                lines[i];

            /*
             * Remove CR if textarea content
             * happens to contain CRLF.
             */

            line =
                line.replace(/\r$/, "");


            await writeRaw(
                line + "\n"
            );


            await sleep(40);


            if (
                i % 10 === 0 ||
                i === lines.length - 1
            ) {

                setStatus(
                    "Writing " +
                    (i + 1) +
                    " / " +
                    lines.length
                );

            }

        }


        /*
         * Finish Bruce's write operation.
         */

        setStatus(
            "Finishing..."
        );


        await writeRaw(
            "EOF\n"
        );


        log(
            ">>> " +
            JSON.stringify("EOF\n")
        );


        /*
         * Wait for Bruce's acknowledgement.
         */

        await sleep(1000);


        log(
            "WRITE RESPONSE:"
        );

        log(rxBuffer);


        /*
         * The firmware should report
         * File written on success.
         */

        if (
            !/File written/i.test(rxBuffer)
        ) {

            /*
             * Still allow a read-back verification
             * because firmware versions can differ
             * in their acknowledgement text.
             */

            log(
                "No 'File written' message; verifying by reading..."
            );

        }


        /* =================================================
           VERIFY
           ================================================= */

        setStatus(
            "Verifying..."
        );


        var verifyCommand =
            "storage read " +
            TARGET_PATH;


        await sendCommand(
            verifyCommand
        );


        var verifyResponse =
            await waitForResponse(5000);


        log(
            "VERIFY RESPONSE:"
        );

        log(
            verifyResponse
        );


        if (
            /ERROR:/i.test(
                verifyResponse
            ) ||
            /Command not found/i.test(
                verifyResponse
            )
        ) {

            throw new Error(
                "Verification read failed"
            );

        }


        var savedContent =
            extractFileContent(
                verifyResponse,
                verifyCommand
            );


        /*
         * Exact comparison.
         */

        if (
            savedContent !== content
        ) {

            log(
                "EXPECTED BYTES: " +
                contentBytes.length
            );

            log(
                "DEVICE BYTES: " +
                encode(savedContent).length
            );

            throw new Error(
                "Device content does not match editor"
            );

        }


        /*
         * SUCCESS
         */

        editor.value =
            savedContent;


        setStatus(
            "✓ SAVED: " +
            TARGET_PATH
        );


        log(
            "SAVE VERIFIED SUCCESSFULLY"
        );


    } catch (error) {

        setStatus(
            "Save failed"
        );

        log(
            "SAVE ERROR: " +
            error.message
        );

    } finally {

        saveButton.disabled = false;
        syncButton.disabled = false;

    }

}


/* =========================================================
   BUTTONS
   ========================================================= */

connectButton.addEventListener(
    "click",
    async function() {

        if (connected) {

            disconnectBruce();

        } else {

            await connectBruce();

        }

    }
);


syncButton.addEventListener(
    "click",
    syncFile
);


saveButton.addEventListener(
    "click",
    saveFile
);

</script>

</body>
</html>
